databaseChangeLog:
  - changeSet:
      id: 004-add-is-deleted-to-participants
      author: timofey chervov

      changes:
        - addColumn:
            tableName: participants
            columns:
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 004-add-is-deleted-to-qr-codes
      author: timofey chervov

      changes:
        - addColumn:
            tableName: qr_codes
            columns:
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false