databaseChangeLog:
  - changeSet:
      id: 001-create-participants
      author: timofey chervov

      changes:
        - createTable:
            tableName: participants

            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR
                  constraints:
                    nullable: false